run:
  deadline: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - structcheck
    - varcheck
    - ineffassign
    - deadcode
    - typecheck
    - gosec
    - gocyclo
    - dupl
    - goconst
    - misspell
    - lll
    - unparam
    - nakedret
    - prealloc
    - nolintlint

linters-settings:
  gofmt:
    simplify: true
  
  goimports:
    local-prefixes: github.com/toutaio/toutago-breitheamh-auth
  
  gocyclo:
    min-complexity: 15
  
  dupl:
    threshold: 100
  
  goconst:
    min-len: 3
    min-occurrences: 5
  
  lll:
    line-length: 120
  
  misspell:
    locale: US
  
  nakedret:
    max-func-lines: 30

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - lll
        - goconst
        - unparam
    
    # SQL providers use string formatting for table names which is by design
    - path: providers/sql_provider\.go
      linters:
        - gosec
      text: "G201"
    
    # TOTP uses SHA1 as required by RFC 6238
    - path: totp\.go
      linters:
        - gosec
      text: "G505"
    
    # Integer overflow conversions are checked and safe
    - linters:
        - gosec
      text: "G115"

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
